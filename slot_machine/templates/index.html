<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeonSlots — Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Animated background particles -->
<div class="bg-particles" id="bgParticles"></div>

<!-- Header -->
<header class="site-header">
  <div class="logo">
    <span class="logo-icon">🎰</span>
    <span class="logo-text">NEON<span class="logo-accent">SLOTS</span></span>
  </div>
  <div class="header-balance" id="headerBalance" style="display:none">
    <span class="balance-label">BALANCE</span>
    <span class="balance-amount" id="headerBalanceAmt">$0</span>
  </div>
</header>

<!-- ═══ DEPOSIT SCREEN ═══════════════════════════════════════════════════ -->
<section class="screen" id="depositScreen">
  <div class="deposit-card">
    <div class="card-glow"></div>
    <h2 class="card-title">WELCOME TO <span class="accent">NEONSLOTS</span></h2>
    <p class="card-subtitle">Enter your starting balance to begin</p>

    <div class="symbol-parade">
      <span>💎</span><span>🔔</span><span>🍋</span><span>🍒</span>
      <span>💎</span><span>🔔</span><span>🍋</span><span>🍒</span>
    </div>

    <div class="input-group">
      <span class="input-prefix">$</span>
      <input type="number" id="depositAmount" placeholder="Enter amount…" min="1" class="neon-input"/>
    </div>
    <p class="input-error" id="depositError"></p>

    <button class="btn-primary" id="depositBtn">
      <span class="btn-text">DEPOSIT &amp; PLAY</span>
      <span class="btn-shine"></span>
    </button>

    <div class="payout-table">
      <div class="pt-title">PAYOUT TABLE</div>
      <div class="pt-row"><span class="sym sym-a">💎 💎 💎</span><span class="pt-mult">× 5</span></div>
      <div class="pt-row"><span class="sym sym-b">🔔 🔔 🔔</span><span class="pt-mult">× 4</span></div>
      <div class="pt-row"><span class="sym sym-c">🍋 🍋 🍋</span><span class="pt-mult">× 3</span></div>
      <div class="pt-row"><span class="sym sym-d">🍒 🍒 🍒</span><span class="pt-mult">× 2</span></div>
    </div>
  </div>
</section>

<!-- ═══ GAME SCREEN ══════════════════════════════════════════════════════ -->
<section class="screen hidden" id="gameScreen">
  <div class="game-layout">

    <!-- Left panel -->
    <aside class="panel panel-left">
      <div class="panel-card">
        <div class="stat-title">BALANCE</div>
        <div class="stat-value neon-green" id="balanceDisplay">$0</div>
      </div>
      <div class="panel-card">
        <div class="stat-title">LAST WIN</div>
        <div class="stat-value neon-gold" id="lastWin">$0</div>
      </div>
      <div class="panel-card">
        <div class="stat-title">NET</div>
        <div class="stat-value" id="netDisplay">$0</div>
      </div>
    </aside>

    <!-- Centre — slot machine -->
    <main class="machine-wrap">
      <div class="machine">
        <div class="machine-top">
          <div class="machine-title">NEON SLOTS</div>
          <div class="machine-lights">
            <span class="light"></span><span class="light"></span><span class="light"></span>
            <span class="light"></span><span class="light"></span>
          </div>
        </div>

        <!-- Reel grid -->
        <div class="reels-container">
          <div class="line-indicator" id="lineIndicator1" data-line="1">LINE 1</div>
          <div class="line-indicator" id="lineIndicator2" data-line="2">LINE 2</div>
          <div class="line-indicator" id="lineIndicator3" data-line="3">LINE 3</div>

          <div class="reels" id="reels">
            <!-- 3×3 grid generated by JS -->
          </div>
        </div>

        <!-- Win message -->
        <div class="win-banner hidden" id="winBanner">
          <span id="winText">YOU WIN!</span>
        </div>

        <!-- Controls -->
        <div class="controls">
          <div class="control-group">
            <label class="ctrl-label">LINES</label>
            <div class="stepper">
              <button class="step-btn" id="linesDown">−</button>
              <span class="step-val" id="linesDisplay">1</span>
              <button class="step-btn" id="linesUp">+</button>
            </div>
          </div>

          <button class="spin-btn" id="spinBtn">
            <span class="spin-icon">▶</span>
            <span class="spin-label">SPIN</span>
            <span class="spin-ring"></span>
          </button>

          <div class="control-group">
            <label class="ctrl-label">BET / LINE</label>
            <div class="stepper">
              <button class="step-btn" id="betDown">−</button>
              <span class="step-val" id="betDisplay">$1</span>
              <button class="step-btn" id="betUp">+</button>
            </div>
          </div>
        </div>

        <div class="total-bet-display">
          TOTAL BET: <span id="totalBetDisplay">$1</span>
        </div>

        <p class="error-msg hidden" id="errorMsg"></p>
      </div>
    </main>

    <!-- Right panel -->
    <aside class="panel panel-right">
      <div class="panel-card">
        <div class="stat-title">SPINS</div>
        <div class="stat-value neon-blue" id="statSpins">0</div>
      </div>
      <div class="panel-card">
        <div class="stat-title">TOTAL WON</div>
        <div class="stat-value neon-gold" id="statWon">$0</div>
      </div>
      <div class="panel-card">
        <div class="stat-title">RTP</div>
        <div class="stat-value neon-pink" id="statRTP">0%</div>
      </div>
      <button class="btn-secondary" id="resetBtn">NEW GAME</button>
    </aside>

  </div>
</section>

<!-- Confetti canvas -->
<canvas id="confettiCanvas"></canvas>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
